name: transformer_scratch
model: transformer
dataset: uci_har
channels:
- total_acc
- body_acc
- body_gyro
group: main
augment:
  jitter: 0.03
  scaling: 0.1
  time_warp: 0.0
model_args:
  d_model: 64
  heads: 4
  layers: 2
  patch: 8
  ff_mult: 2
  dropout: 0.47325604079300865
train:
  epochs: 60
  batch_size: 32
  lr: 0.0023245954661191477
  weight_decay: 0.0001277826875349593
  patience: 10
  label_smoothing: 0.0
